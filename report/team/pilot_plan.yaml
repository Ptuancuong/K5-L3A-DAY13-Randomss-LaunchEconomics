# Lab 13 · Nhiệm vụ D · Kế hoạch pilot trợ lý hoàn phí LogiX-VN (Gate 2a) · Nhóm Randomss
# Số D1 tính bằng src/lab13.py. Kiểm tra đọc được: python -c "import yaml; yaml.safe_load(open('../report/team/pilot_plan.yaml', encoding='utf-8'))"
#
# D1 · Cỡ mẫu (baseline 0,70; mục tiêu +5 điểm; alpha 0,05; power 0,8; ICC 0,02)
#   a) Chia theo yêu cầu: co_mau(0,70; 0,75) = 1.251 yêu cầu mỗi nhóm (statsmodels ra 1.250, trong sai số 2%)
#   b) Theo nhân viên, m = 75: DE = 1 + 74 × 0,02 = 2,48; n = 1.251 × 2,48 = 3.103 mỗi nhóm -> 42 NV mỗi nhóm, tổng 84 > 40 NV: không đủ người
#   c) 20 nhân viên mỗi nhóm: n hiệu dụng tối đa = c / ICC = 20 / 0,02 = 1.000 < 1.251: không đạt mức 5 điểm
#   d) 6 depot mỗi nhóm: n hiệu dụng tối đa = 6 / 0,02 = 300
#   e) Mức chênh 6 điểm (859 mỗi nhóm), 20 NV mỗi nhóm: 20m / (1 + (m - 1) × 0,02) >= 859 -> m >= 299 yêu cầu mỗi NV (DE 6,96)
#
# D2 · Năm câu kiểm tra "tách được tác động" với cách chia đã chọn (theo nhân viên, 20 + 20):
#   1. Đối chứng chạy cùng thời gian: có, 20 NV đối chứng làm cùng tuần, cùng depot với 20 NV dùng trợ lý
#   2. Chia ngẫu nhiên hay do người chọn: ngẫu nhiên bằng code, seed ghi trước (20261201), phân tầng theo depot
#   3. Ảnh hưởng gián tiếp và cách giảm: NV cùng depot có thể chia sẻ câu trả lời; giảm bằng quyền truy cập theo tài khoản, log lượt mở trợ lý theo staff_id
#   4. Chỉ số chính, ngưỡng, ngày quyết định đã viết trước: có, chốt trong file này trước ngày bắt đầu 2026-12-01
#   5. Ít nhất 20 cụm mỗi nhóm: có, đúng 20 cụm (nhân viên) mỗi nhóm
#
# Đánh đổi đã chấp nhận: 40 NV không đủ để thấy mức chênh 5 điểm (tối đa 1.000 < 1.251).
#   Chấp nhận MDE 6 điểm (859 mỗi nhóm, mỗi NV >= 299 yêu cầu). Nếu tác động thật chỉ 5 điểm thì power chỉ còn khoảng 0,64.
#   Giám đốc vận hành phải ký chấp nhận con số bất lợi này trước ngày bắt đầu.
#
# Tỉ lệ mo_lai_trong_7_ngay hiện tại: 4,25% (51/1.200) toàn bộ; 3,97% (39/982) trong phạm vi noi_dia + hang_nang.
#   Ngưỡng tuyệt đối 3% sẽ làm pilot dừng ngay tuần đầu, nên luật an toàn so với nhóm đối chứng (chênh >= 2 điểm) kèm trần tuyệt đối 6%.

pilot:
  owner: "Giám đốc vận hành LogiX-VN"
  scope: "Chỉ noi_dia và hang_nang (0,22x và 0,69x so với 12.000 đ, simulated), 40 NV CSKH ở 12 depot; loại quoc_te (1,88x, thành công 27,3%) và doi_tac (0,85x, điều khoản riêng)"
  assignment:
    unit: "staff"
    control_share: 0.5
    randomized: true
  rollout: [0.10, 0.25, 0.50]     # mỗi bước một tuần: 4 -> 10 -> 20 NV dùng trợ lý; chỉ số chính chỉ đo từ bước 0.50
  primary_metric:
    name: dong_trong_24h_khong_mo_lai_7_ngay
    baseline: 0.70
    mde: 0.06                     # đánh đổi đã chấp nhận, xem chú thích đầu file
    alpha: 0.05
    power: 0.80
    n_per_arm: 859
    design_effect: 6.96
    clusters_per_arm: 20
    min_requests_per_staff: 299
  identifiability:
    concurrent_control: "Có: 20 NV đối chứng làm cùng thời gian, cùng depot, phân ngẫu nhiên theo staff_id với seed 20261201, phân tầng theo depot"
    spillover_risk: "Trung bình: NV cùng depot có thể chia sẻ câu trả lời; giảm bằng quyền truy cập theo tài khoản và log agent_suggestion_shown theo staff_id, loại khỏi phân tích NV đối chứng có lượt mở trợ lý"
    predeclared: "Có: chỉ số chính, MDE 0,06, ba luật dừng và ngày quyết định 2027-01-29 chốt trong file này trước ngày bắt đầu 2026-12-01"
  stop_rules:
    - "AN TOÀN · NẾU tỉ lệ mở lại 7 ngày của nhóm trợ lý cao hơn đối chứng từ 2 điểm trở lên hoặc vượt 6% tuyệt đối, hoặc có từ 1 ca hoàn trùng trở lên TRONG 3 ngày liên tiếp THÌ Giám đốc vận hành tắt trợ lý trong 30 phút và Kỹ sư trưởng agent rà toàn bộ trace liên quan KHÔNG THÌ không được sang bước rollout tiếp theo"
    - "CHI PHÍ · NẾU chi phí mỗi việc thành công của nhóm trợ lý (đã cộng phút xem lại và làm lại đo thật) trên 8.000 đ TRONG 2 tuần liên tiếp THÌ PM trợ lý hoàn phí thu hẹp phạm vi về noi_dia và đặt giới hạn 2 lần chạy KHÔNG THÌ không được mở thêm hang_nang hay tăng tỉ lệ rollout"
    - "SỬ DỤNG · NẾU tỉ lệ bỏ qua gợi ý (sua + bo trên số được xem lại) trên 40% TRONG 1 tuần THÌ Trưởng nhóm CSKH phỏng vấn 5 NV nhóm trợ lý trong 3 ngày và báo PM trợ lý hoàn phí KHÔNG THÌ không được chuyển bước rollout"
    - "XEM LẠI · NẾU thời gian xem lại trung bình trên 5 phút mỗi yêu cầu TRONG 2 tuần liên tiếp THÌ PM trợ lý hoàn phí đề xuất No-go cho bước mở rộng vì xem lại 100% đã ở mức 0,98x đến 1,03x (simulated) KHÔNG THÌ không được giảm tỉ lệ xem lại theo bậc"
  interim_looks: "chỉ kiểm tra chỉ số an toàn (mở lại 7 ngày, hoàn trùng) hằng ngày và chỉ số chi phí, sử dụng hằng tuần; không xem chỉ số chính trước ngày quyết định"
  rollback: "Giám đốc vận hành bấm cờ tắt trợ lý, hiệu lực trong 30 phút; khách được phục vụ bằng luồng nhân viên tự làm như nhóm đối chứng (6 phút mỗi yêu cầu)"
  decision_date: "2027-01-29"
  simulated_inputs:
    - "phut_xem_lai_simulated: 890 phút, 1.780.000 đ"
    - "phut_lam_lai_simulated: 1.132 phút, 2.264.000 đ (TB 15,3 phút mỗi ca lam_lai)"
    - "Chi phí mỗi việc thành công 4.472 đ; theo loại 2.696 / 8.221 / 22.515 / 10.215 đ"
    - "Chi phí trong phạm vi 3.414 đ, cộng cố định 4.599 đ (0,38x) ở 45.000 yêu cầu mỗi tháng"
    - "Bảng độ nhạy B1 đến B3 và xem lại 100% B4: 11.743 đ (0,98x) hoặc 12.415 đ (1,03x)"
    - "Ngưỡng chi phí 8.000 đ trong luật dừng dựa trên số simulated"
